name: Repository content policy

on:
  pull_request:
  push:
    branches:
      - main
      - codex/v4-unified-development
      - codex/v4-workspace-cleanup

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check changed commit blobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$BASE_SHA"
          else
            BASE="$BEFORE_SHA"
          fi
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
            BASE="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || true)"
          fi
          if [[ -z "$BASE" ]]; then
            echo "Cannot determine the commit range for repository policy." >&2
            exit 2
          fi
          python tools/git_repository_policy.py --diff-base "$BASE" --diff-head "$HEAD_SHA"

  v4-pg-publication-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test runner
        run: python -m pip install pytest
      - name: Check V4 PG publication contract and candidate code
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_v4_pg_publication_candidate.py
          tests/test_v4_pg_publication_owners.py
          tests/test_v4_pg_publication_contract_static.py
