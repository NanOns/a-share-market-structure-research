tdx:
  # Corrected from the initially supplied D:/new/_tdx after read-only discovery.
  source_root: "D:/new_tdx"
  # Optional. Set these in deployment configuration when the corresponding route is used.
  # daily_download_root: "G:/market_data/tdx/daily"
  snapshot_root: "data/v4/dynamic_daily_sources"

baostock:
  # Native BaoStock request responses used by runtime acceptance and PG ingress.
  download_root: "data/v4/source_snapshots/baostock_downloads"
  cache_root: "data/v4/source_snapshots"
  # Explicitly retain the existing shared request-budget ledger in place.
  request_ledger: "reports/v4_baostock/request_ledger.json"

ingest:
  # Optional temporary source files, never inside a TDX read-only root.
  temp_root: "G:/codex_tmp"

project:
  phase0_output: "reports/phase0/TDX_DATA_AUDIT.json"

v4:
  market_source_capture_root: "docs/evidence/source_acquisition_r4_20261009/capture"

