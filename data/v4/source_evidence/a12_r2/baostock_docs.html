<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/bitbug_favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>www.baostock.com</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    
    <script>
    if (!Array.prototype.at) {
        Array.prototype.at = function(index) {
            index = Math.trunc(index) || 0;
            if (index < 0) index += this.length;
            if (index < 0 || index >= this.length) return undefined;
            return this[index];
        };
    }
    </script>

    <style>
      #adOverlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: none;
        z-index: 9999;
        justify-content: center;
        align-items: center;
      }
      #adContent {
        border-radius: 5px;
        position: relative;
        max-width: 80%;
        max-height: 80%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: transparent;
        padding: 0;
      }
      #closeAd {
        position: absolute;
        top: 10px;
        right: 10px;
        cursor: pointer;
        font-size: 24px;
        color: #fff;
        background: rgba(0,0,0,0.5);
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
      }
      .ad-image {
        max-width: 100%;
        max-height: 70%;
        object-fit: contain;
      }
      .ad-image.full-size {
        max-height: none;
        max-width: none;
        object-fit: contain;
      }
      .ad-text-container {
        margin-top: 15px;
        text-align: center;
        background: white;
        padding: 20px;
      }
      .ad-title {
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 15px;
        color: #333;
      }
      .ad-description {
        text-align: center;
        font-size: 14px;
        color: #666;
        margin-bottom: 15px;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-DUQ-MKvt.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Bs6VLseC.css">
  </head>
  <body>
    <div id="adOverlay">
      <div id="adContent">
        <span id="closeAd">×</span>
        <div id="adContainer"></div>
      </div>
    </div>
    <div id="app"></div>
    <script>
        // 检查是否已经显示过广告Logo（使用localStorage实现持久存储）
        const adLogoShown = localStorage.getItem('adLogoShown');
        
        // 获取广告配置
        async function loadAdConfig() {
          // 如果已经显示过广告Logo，则不再显示广告
          if (adLogoShown) {
            console.log("adLogoShown - skipping ad display");
            return;
          }
          
          try {
            const response = await fetch('articleMall/api/ad-config');
            const adItems = await response.json();
            console.log('Ad Items:', adItems)
            // 查找状态为on且位置为logo的广告
            const logoAd = adItems.find(ad => 
              ad.status === 'on' && 
              ad.position === 'logo' &&
              isAdValid(ad)
            );
            console.log("logoAd",logoAd);
            if (logoAd) {
              showAd(logoAd);
            }
          } catch (error) {
            console.error('Failed to load ad config:', error);
            // 如果API请求失败，显示模拟广告
            //showMockAd();
          }
        }

        // 检查广告是否在有效期内
        function isAdValid(ad) {
          const now = new Date();
          const startDate = new Date(ad.startDate);
          const endDate = new Date(ad.endDate);
          console.log("startDate",startDate);
          console.log("endDate",endDate);
          console.log("now",now);
          return now >= startDate && now <= endDate;
        }
        
        // 显示模拟广告（当API不可用时）
        function showMockAd() {
          // 如果已经显示过广告Logo，则不再显示广告
          if (localStorage.getItem('adLogoShown')) {
            return;
          }
          
          // 模拟广告数据
          const ad = {
            title: 'baostock 开源金融数据平台',
            description: '专业的金融数据服务',
            imageUrl: 'https://www.baostock.com/images/logo.png',
            duration: 60 // 广告显示时长，单位为秒
          };
          
          // 调用显示广告的函数
          showAd(ad);
        }

      // 全局函数，用于处理广告点击导航
      function showAdContent(fileName) {
        const overlay = document.getElementById('adOverlay');
        // 隐藏广告
        overlay.style.display = 'none';
        
        // 导航到mainContent并显示指定的markdown文件
        window.location.href = '/mainContent?file=' + fileName;
      }

      function showAd(ad) {
        const overlay = document.getElementById('adOverlay');
        const adContainer = document.getElementById('adContainer');
        // 使用localStorage存储，确保在整个浏览器中只显示一次
        localStorage.setItem('adLogoShown', 'true');
        
        // 判断是否需要显示标题和描述
        const hasText = ad.title && ad.description;
        
        // 构建广告HTML，根据是否有文本内容调整结构
        let adHtml = '';
        
        if (!hasText) {
          // 如果没有标题和描述，图片填充整个空间
          adHtml = `
            <a href="javascript:void(0);" onclick="showAdContent('home.md');" style="display: block;">
              <img src="${ad.imageUrl}" alt="${ad.title || 'Advertisement'}" class="ad-image full-size">
            </a>
          `;
        } else {
          // 如果有标题和/或描述，正常显示
          adHtml = `
            <div class="ad-text-container">
              ${ad.title ? `<div class="ad-title">${ad.title}</div>` : ''}
              ${ad.description ? `<div class="ad-description">${ad.description}</div>` : ''}
            </div>
            <a href="javascript:void(0);" onclick="showAdContent('registerAccount.md');" style="display: block;">
              <img src="${ad.imageUrl}" alt="${ad.title || 'Advertisement'}" class="ad-image">
            </a>
          `;
        }
        
        // 显示广告
        overlay.style.display = 'flex';
        adContainer.innerHTML = adHtml;
        
        // 设置关闭按钮事件
        document.getElementById('closeAd').onclick = () => {
          overlay.style.display = 'none';
        };
        
        // 设置自动关闭（duration单位为秒，需要转换为毫秒）
        setTimeout(() => {
          overlay.style.display = 'none';
        }, ad.duration * 2500);
      }

      // 页面加载完成后加载广告配置
      window.addEventListener('load', () => {
        // 只有当页面是直接打开（不是通过站内链接跳转）时才显示广告
        if (document.referrer === '' || !document.referrer.includes(window.location.origin)) {
          setTimeout(() => {
            loadAdConfig();
          }, 1000); // 1秒后尝试加载广告
        } else {
          console.log('Page loaded from internal link - skipping ad display');
        }
      });
      
      // 监听标签页关闭事件，清除localStorage中的adLogoShown数据
      window.addEventListener('beforeunload', () => {
        console.log('标签页关闭，清除adLogoShown');
        localStorage.removeItem('adLogoShown');
      });
    </script>
  </body>
</html>
