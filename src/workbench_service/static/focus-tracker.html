<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关注跟踪</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#19324d;background:#f3f6fa;--blue:#1769aa;--line:#dbe4ee;--muted:#687d92;--warn:#fff7e8;--red:#a52a24}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1600px;margin:16px auto;padding:0 18px}.notice{padding:11px 14px;background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:12px;line-height:1.55}.notice.warn{background:var(--warn);color:#724300;border-color:#edcb85}.notice.error{color:var(--red);border-color:#e7b7b2}.controls{display:flex;align-items:end;gap:9px;flex-wrap:wrap;margin-bottom:12px}.controls label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.controls select,.controls input,.controls button,.pager button,.tabs button{min-height:38px;padding:8px 10px;border:1px solid #cbd8e4;border-radius:7px;background:#fff;color:#19324d}.controls button,.pager button,.tabs button{cursor:pointer;color:#24577f}.controls select{min-width:140px}.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:12px 0}.tabs button.active{background:#e7f3fc;border-color:#98c3e2;color:#125b91;font-weight:700}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:12px}.intro{font-size:13px;line-height:1.6;color:#52677c;margin:0 0 12px}.section-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:2px 0 10px}.section-title h2{font-size:17px;margin:0}.section-title small{color:var(--muted)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px;font-size:13px}th,td{padding:9px 8px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top}th{background:#f7f9fb;color:#60758a;white-space:nowrap}td{overflow-wrap:anywhere}.link{border:0;background:none;color:var(--blue);padding:0;text-decoration:underline;cursor:pointer;font:inherit}.state-lines{display:grid;gap:4px;min-width:180px}.state-line{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.state-line b{color:#536b80;font-size:12px;min-width:68px}.empty{padding:30px 12px;text-align:center;color:var(--muted)}.pager{display:flex;justify-content:center;gap:12px;align-items:center;padding:12px;color:var(--muted);font-size:13px}.pager button:disabled{opacity:.45;cursor:not-allowed}.detail h2{font-size:18px;margin:2px 0 7px}.detail h3{font-size:15px;margin:18px 0 7px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}.card{border:1px solid var(--line);border-radius:8px;padding:10px}.card small,.card b{display:block}.card small{color:var(--muted);line-height:1.5}.card b{font-size:16px;margin-top:3px}.subtle{color:var(--muted);font-size:12px}.event-reason{max-width:320px;line-height:1.55}.compact{min-width:0}details summary{cursor:pointer;color:var(--blue)}@media(max-width:900px){.wrap{padding:0 10px}.panel{padding:11px}}
.stock-name{display:block;font-weight:700;color:#19324d;text-decoration:none}.stock-code{display:block;color:var(--muted);font-size:12px;margin-top:2px}.sector-trigger{border:0;background:transparent;color:#19324d;padding:0;cursor:pointer;font:inherit;font-weight:700}.sector-dialog{width:min(1000px,94vw);max-height:85vh;border:1px solid var(--line);border-radius:12px;padding:18px;color:#19324d}.sector-dialog::backdrop{background:#10243c88}.dialog-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}.dialog-head h2{font-size:19px;margin:0}.dialog-head p{margin:5px 0 0}.dialog-close{border:1px solid #cbd8e4;border-radius:7px;background:#fff;padding:7px 12px;cursor:pointer;color:#24577f}.member-table{min-width:720px}.member-strong{color:#176a3a;font-weight:700}.member-unknown{color:#687d92}.member-path{display:block;margin-top:3px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main class="wrap">
 <div id="notice" class="notice" role="status" aria-live="polite">正在读取持续观察总览…</div>
 <nav class="tabs" aria-label="关注跟踪视图"><button data-tab="items" class="active">持续观察总览</button><button data-tab="transitions">变化记录</button><button data-tab="statistics">历史结果复盘</button></nav>
 <section id="content" class="panel"></section>
 <dialog id="sector-dialog" class="sector-dialog"><div class="dialog-head"><div><h2 id="sector-title">板块成分股</h2><p id="sector-summary" class="subtle">按板块首次纳入观察时冻结的成分读取</p></div><button id="sector-close" class="dialog-close" aria-label="关闭">关闭</button></div><div id="sector-body"></div><div class="pager"><button id="sector-prev">上一页</button><span id="sector-page"></span><button id="sector-next">下一页</button></div></dialog>
</main>
<script>
(()=>{'use strict';
const state={run:null,tab:'items',page:1,candidatePage:1,candidateSize:25,filters:{},sectorNames:{},itemsCache:[],sectorId:'',sectorPage:1,sectorPageSize:20,sectorTotal:0};
const $=s=>document.querySelector(s),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const familyNames={V3_SHORTLIST_STOCK:'V3 个股观察',V3_SECTOR_TRACK:'V3 板块跟踪',V3_3_TODAY_CANDIDATE:'V3.3 今日候选',V3_SHORTLIST_INDIVIDUAL:'V3 个股候选'};
const maps={
 evaluation:{REAL_FORWARD:'真实前瞻',HISTORICAL_RECONSTRUCTED:'历史重建'},lineage:{VALID:'连续有效',HISTORICAL:'历史版本',REPLAY_REQUIRED:'等待重放'},
 membership:{CURRENT:'当前在榜',EARLY:'提前观察',CANDIDATE:'算法候选',INDIVIDUAL:'独立个股',NONE:'来源已退出',UNKNOWN:'未知',SOURCE_CURRENT:'来源名单仍在',SOURCE_EARLY:'提前观察名单',NOT_MEMBER:'不在来源名单'},
 phase:{NEW:'首次进入',RETAINED:'持续在榜',REENTERED:'重新进入',EXITED:'退出来源名单',FOLLOWUP:'退出后跟踪'},
 validity:{VALID:'规则未触发失效',INVALIDATED:'已触发失效条件',UNKNOWN:'证据不足，暂不能判断'},
 followup:{ACTIVE_FOCUS:'仍在持续观察',FOLLOW_UP_COMPLETED:'观察已完成',SOURCE_ACTIVE:'来源仍在名单',NOT_REQUIRED:'无需后续观察',UNKNOWN:'状态未知'},
 path:{DATA_UNAVAILABLE:'路径数据暂不可用',UNCLASSIFIED:'路径尚未归类',NO_PATH:'暂无明显路径',BASE_BUILD:'底部构建',BREADTH_BUILD:'宽度扩散',RECOVERY_BUILD:'修复回升',TREND_CONTINUE:'趋势延续',TREND_ACCELERATING:'趋势加速',LAUNCH_CONFIRM:'启动确认',STRUCTURE_BREAK:'结构破坏',EXTENDED:'短期偏离较大',UNKNOWN:'路径未知',CURRENT_SECTOR:'当前板块观察',EARLY_SECTOR:'提前观察板块',CURRENT_FOCUS:'当前关注个股',SETUP_WATCH:'形态观察',BREAKOUT:'结构突破',RECOVERY_TURN:'修复转强'},
 continuity:{FIRST_DAY:'首日记录',CONTIGUOUS:'连续交易日',GAP:'存在观察缺口',RESUMED:'缺口后恢复',UNKNOWN:'连续性未知'},
 quality:{READY:'数据齐备',PARTIAL:'数据部分齐备',UNKNOWN:'数据未知',DATA_UNAVAILABLE:'数据不可用',INVALID:'数据无效',MISSING:'数据缺失',INSUFFICIENT:'证据不足'},
 event:{NEW:'新进入观察',RETAINED:'持续在榜',EXIT:'退出观察',REENTERED:'重新进入观察',CURRENT_UPGRADE:'升级为当前关注',SOURCE_REVISED:'来源修订',FOLLOWUP_COMPLETED:'后续观察完成',SETTLEMENT_REOPENED:'结果重新核验',MILESTONE:'阶段观察节点',SOURCE_FAMILY_BOUNDARY:'来源规则版本变化',ANCHOR_CREATED:'建立收益观察起点'},
 reason:{SOURCE_MEMBERSHIP:'来源名单新增',SOURCE_EXIT:'来源名单移除',SOURCE_REVISION:'来源结果修订',SOURCE_FAMILY_BOUNDARY:'来源规则版本变化',FOLLOW_UP_COMPLETED:'所需观察与结果已完成',MEMBERSHIP_CHANGED:'来源名单状态变化',VALIDITY_CHANGED:'失效判断变化',PATH_CHANGED:'走势分类变化',DATA_GAP:'行情或输入数据缺失'},
 generic:{OBSERVED:'已完成观察',PENDING:'等待结果到期',INCOMPLETE:'结果资料不完整',SUSPENDED:'停牌，无收益记录',DELISTED:'退市，停止计算',DATA_GAP:'数据缺口待核验',SOURCE_REVISED:'等待来源修订',INSUFFICIENT_SAMPLES:'样本不足',STATISTICS_NOT_MATERIALIZED:'尚未生成统计结果',STATISTICS_SCHEMA_UNAVAILABLE:'统计服务暂不可用',NOT_APPLICABLE:'不适用',NOT_REQUESTED:'尚未请求',AS_RECORDED:'当日实际记录',ENTRY:'首次进入',EXIT_EFFECTIVE:'退出生效',CURRENT_UPGRADE:'升级为当前关注',FIRST_FOCUS:'首次关注',FOCUS_START:'观察开始',CONFIRMED:'已确认支持',SUPPORTED:'板块支持',UNSUPPORTED:'未获板块支持',READY:'数据齐备',PARTIAL:'数据部分齐备',NONE:'暂无',FRESH:'新鲜记录',STALE:'较早记录',REAL_FORWARD:'真实前瞻',HISTORICAL_RECONSTRUCTED:'历史重建'}
};
function tr(group,v){if(v==null||v==='')return '暂无记录';const val=String(v);return maps[group]?.[val]||maps.generic[val]||familyNames[val]||'其他已记录状态'}
function notice(text,kind=''){const n=$('#notice');n.textContent=text;n.className='notice '+kind}
function meta(){const r=state.run;if(!r){notice('当前没有可展示的有效观察批次。','warn');return}notice(`持续观察总览 · 截至 ${r.trade_date} · ${tr('evaluation',r.evaluation_basis)}${r.lineage_state==='HISTORICAL'?' · 历史版本':''}` ,r.evaluation_basis==='HISTORICAL_RECONSTRUCTED'?'warn':'')}
async function api(path,params={}){const q=new URLSearchParams({...(state.run?{focus_run_id:state.run.focus_run_id}:{}),...params});const response=await fetch(path+(q.size?'?'+q:''),{cache:'no-store'});let body={};try{body=await response.json()}catch{}if(!response.ok){const e=new Error(body.code||body.message||`HTTP_${response.status}`);e.status=response.status;e.body=body;throw e}return body}
function unavailable(error){if(error.status===503)notice('数据库当前不可用，请稍后重试。','error');else notice('本次读取未完成，请检查连接后重试。','error')}
function cell(value){return `<td>${esc(value)}</td>`}function table(headers,rows,cls=''){return `<div class="table-wrap"><table class="${cls}"><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table></div>`}
function pct(value){const n=Number(value);return value==null||!Number.isFinite(n)?'暂无':`${(n*100).toFixed(2)}%`}
function stateLines(x){return `<div class="state-lines"><div class="state-line"><b>名单状态</b><span>${esc(tr('membership',x.source_membership_state))}</span></div><div class="state-line"><b>本次变化</b><span>${esc(tr('phase',x.membership_phase))}</span></div><div class="state-line"><b>规则判断</b><span>${esc(tr('validity',x.validity_state))}</span></div><div class="state-line"><b>观察进度</b><span>${esc(tr('followup',x.followup_state))}</span></div><div class="state-line"><b>走势路径</b><span>${esc(tr('path',x.current_path_state))}</span></div><div class="state-line"><b>连续性</b><span>${esc(tr('continuity',x.continuity_quality))}；缺口 ${esc(x.comparison_gap_sessions??0)} 个交易日</span></div></div>`}
function facts(x){return x.source_facts||{}}
function scenarioName(x){const f=facts(x);const value=f.primary_category||f.scenario||x.source_focus_class;return value?tr('path',value):'未标注场景'}
function optionsHtml(values,group,all='全部'){return `<option value="">${all}</option>${values.map(v=>`<option value="${esc(v.value)}">${esc(v.label||tr(group,v.value))}</option>`).join('')}`}
function makeFilters(){const familyVals=Object.keys(familyNames).map(k=>({value:k,label:familyNames[k]}));const memberVals=['CURRENT','EARLY','CANDIDATE','INDIVIDUAL','NONE','UNKNOWN'].map(value=>({value,label:tr('membership',value)}));const validityVals=['VALID','INVALIDATED','UNKNOWN'].map(value=>({value,label:tr('validity',value)}));const pathVals=[...new Set(state.itemsCache.map(x=>x.current_path_state).filter(Boolean))].map(value=>({value,label:tr('path',value)}));const qualityVals=[...new Set(state.itemsCache.map(x=>x.quality_status||x.source_quality).filter(Boolean))].map(value=>({value,label:tr('quality',value)}));const scenes=new Map();state.itemsCache.forEach(x=>{const f=facts(x);const v=f.scenario||f.scenario_id||f.primary_category||f.source_focus_class;if(v)scenes.set(String(v),scenarioName(x))});const sectors=new Map(Object.entries(state.sectorNames));state.itemsCache.forEach(x=>{const f=facts(x);for(const id of [x.entry_primary_sector_id,x.current_primary_sector_id,f.primary_sector_id,...(f.alternative_sector_ids||[])])if(id)sectors.set(String(id),state.sectorNames[id]||'已记录板块')});sectors.set('__SUPPORT_CONFIRMED__','已确认有板块支持（未提供具体名称）');sectors.set('__SUPPORT_UNCONFIRMED__','暂未确认板块支持');
 return `<div class="controls" aria-label="观察记录筛选"><label>来源<select id="f-family">${optionsHtml(familyVals,'')}</select></label><label>名单状态<select id="f-member">${optionsHtml(memberVals,'membership')}</select></label><label>规则判断<select id="f-validity">${optionsHtml(validityVals,'validity')}</select></label><label>走势路径<select id="f-path">${optionsHtml(pathVals,'path')}</select></label><label>数据质量<select id="f-quality">${optionsHtml(qualityVals,'quality')}</select></label><label>候选场景<select id="f-scenario">${optionsHtml([...scenes].map(([value,label])=>({value,label})),'')}</select></label><label>支持板块<select id="f-sector">${optionsHtml([...sectors].map(([value,label])=>({value,label})),'')}</select></label><button id="apply-filter">应用筛选</button><button id="clear-filter">清除条件</button></div>`}
async function loadResearchNames(){try{const s=await api('/api/v3/focus-tracker/sectors/catalog');(s.items||[]).forEach(x=>{state.sectorNames[x.sector_id]=x.name||`${x.type==='INDUSTRY'?'行业板块':'主题板块'} ${String(x.sector_id).replace(/^[^:]+:/,'')}`});}catch(_){}}
async function fetchBuckets(){await loadResearchNames();const common={...state.filters};const sectorFilters={...common};delete sectorFilters.sector_id;const jobs=[];const families=Object.keys(familyNames).filter(f=>f!=='V3_3_TODAY_CANDIDATE');if(common.source_family&&common.source_family==='V3_3_TODAY_CANDIDATE')families.length=0;else if(common.source_family)families.splice(0,families.length,common.source_family);for(const family of families){if(family==='V3_SECTOR_TRACK')jobs.push(api('/api/v3/focus-tracker/items',{...sectorFilters,source_family:family,entity_type:'SECTOR',page:1,page_size:100}).then(x=>({family,items:x.items||[],total:x.total||0})));else jobs.push(api('/api/v3/focus-tracker/items',{...common,source_family:family,entity_type:'STOCK',page:1,page_size:100}).then(x=>({family,items:x.items||[],total:x.total||0}))) }let candidate={items:[],total:0,page:state.candidatePage,has_more:false};if(!common.source_family||common.source_family==='V3_3_TODAY_CANDIDATE')candidate=await api('/api/v3/focus-tracker/items',{...common,source_family:'V3_3_TODAY_CANDIDATE',entity_type:'STOCK',page:state.candidatePage,page_size:state.candidateSize});const groups=await Promise.all(jobs);state.itemsCache=[...groups.flatMap(x=>x.items),...(candidate.items||[])];return {groups,candidate}}
function supportLabels(x){const f=facts(x),ids=[f.primary_sector_id,...(f.alternative_sector_ids||[])].filter(Boolean);if(ids.length)return [...new Set(ids)].map(id=>state.sectorNames[id]||'已记录板块').join('、');if(f.sector_support_status==='CONFIRMED')return '已确认板块支持（来源未给出名称）';if(f.sector_support_status==='NOT_CONFIRMED')return '暂未确认板块支持';return '暂无所属板块'}
function strengthLabel(v){return v===true?'强势':v===false?'未达强势标准':'暂缺可靠强弱判定'}
function itemRow(x){const entityName=x.entity_type==='SECTOR'?(state.sectorNames[x.entity_id]||'观察板块'):(x.security_name||facts(x).security_name||'名称未提供');const id=x.episode_id||'';const isSector=x.entity_type==='SECTOR';const primary=supportLabels(x);const tracked=x.current_primary_sector_id?state.sectorNames[x.current_primary_sector_id]||'已记录板块':x.entry_primary_sector_id?state.sectorNames[x.entry_primary_sector_id]||'已记录板块':'暂无跟踪板块';return `<tr class="${isSector?'sector-row':''}"><td>${isSector?`<button class="sector-trigger" aria-label="查看${esc(entityName)}板块成员" data-sector="${esc(x.entity_id)}">${esc(entityName)}</button>`:`<button class="stock-name" data-detail-episode="${esc(id)}">${esc(entityName)}</button><small class="stock-code">${esc(x.entity_id)}</small>`}</td><td>${esc(x.first_trade_date||'—')}<small class="subtle"><br>已记录 ${esc(x.observed_session_count??'—')} 个交易日</small></td><td>${stateLines(x)}</td><td>${esc(primary)}<small class="subtle"><br>当前跟踪：${esc(tracked)}</small></td><td>${esc(scenarioName(x))}</td><td>${esc(pct(x.return_since_first))}<small class="subtle"><br>距高点回撤 ${esc(pct(x.drawdown_from_peak))}</small></td><td>${esc(tr('quality',x.quality_status||x.source_quality))}</td><td><button class="link" data-detail-episode="${esc(id)}">观察详情</button></td></tr>`}
function cssSafe(v){return String(v).replace(/[^a-zA-Z0-9_-]/g,'_')}
async function loadItems(){state.page=1;$('#content').innerHTML='<p class="intro">这是截至最新有效观察批次的持续观察总览。表格显示每个对象当前已记录的状态；点击个股查看它的时间线，点击板块名称按需查询成分股及强势状态。</p><div id="filter-box">正在准备筛选项…</div><div id="lists"></div>';try{const data=await fetchBuckets();$('#filter-box').innerHTML=makeFilters();for(const [id,key] of [['f-family','source_family'],['f-member','membership'],['f-validity','validity'],['f-path','path'],['f-quality','quality'],['f-scenario','scenario'],['f-sector','sector_id']])$('#'+id).value=state.filters[key]||'';$('#apply-filter').onclick=()=>{state.filters={source_family:$('#f-family').value,membership:$('#f-member').value,validity:$('#f-validity').value,path:$('#f-path').value,quality:$('#f-quality').value,scenario:$('#f-scenario').value,sector_id:$('#f-sector').value};state.candidatePage=1;loadItems()};$('#clear-filter').onclick=()=>{state.filters={};state.candidatePage=1;loadItems()};
 const allRows=state.itemsCache,sectors=allRows.filter(x=>x.entity_type==='SECTOR'),ordinary=allRows.filter(x=>x.entity_type==='STOCK'&&x.source_family!=='V3_3_TODAY_CANDIDATE'),candidate=allRows.filter(x=>x.source_family==='V3_3_TODAY_CANDIDATE');const total=data.groups.reduce((n,x)=>n+x.total,0)+data.candidate.total;const sectorRows=sectors.map(itemRow).join('');
 $('#lists').innerHTML=`<div class="run-label subtle">当前总览 ${total} 条，状态更新至 ${esc(state.run.trade_date)}；V3.3 候选每页 ${state.candidateSize} 条。</div><div class="section-title"><h2>观察板块</h2><small>${sectors.length} 个观察板块</small></div>${sectorRows?table(['板块名称','首次纳入','当前跟踪状态','原支持板块 / 当前支持板块','观察场景','收益与回撤','数据质量','详情'],sectorRows):'<div class="empty">当前筛选下没有板块记录。</div>'}<div class="section-title"><h2>独立观察个股</h2><small>${ordinary.length} 只</small></div>${ordinary.length?table(['股票名称 / 代码','首次纳入','当前跟踪状态','所属板块 / 当前支持板块','观察场景','收益与回撤','数据质量','详情'],ordinary.map(itemRow).join('')):'<div class="empty">当前筛选下没有独立个股记录。</div>'}${candidate.length?`<details class="panel compact" ${state.filters.source_family==='V3_3_TODAY_CANDIDATE'?'open':''}><summary>V3.3 今日候选：${data.candidate.total} 只</summary><p class="intro">按页读取和展示。候选仍作为独立观察对象呈现。</p>${table(['股票名称 / 代码','首次纳入','当前跟踪状态','所属板块 / 当前支持板块','观察场景','收益与回撤','数据质量','详情'],candidate.map(itemRow).join(''))}<div class="pager"><button id="candidate-prev" ${state.candidatePage<=1?'disabled':''}>上一页</button><span>第 ${data.candidate.page} 页 · 共 ${data.candidate.total} 只</span><button id="candidate-next" ${!data.candidate.has_more?'disabled':''}>下一页</button></div></details>`:''}`;
 $('#candidate-prev')?.addEventListener('click',()=>{state.candidatePage--;loadItems()});$('#candidate-next')?.addEventListener('click',()=>{state.candidatePage++;loadItems()});$('#lists').querySelectorAll('[data-detail-episode]').forEach(b=>b.onclick=()=>b.dataset.detailEpisode&&loadEpisode(b.dataset.detailEpisode));$('#lists').querySelectorAll('[data-sector]').forEach(b=>b.onclick=()=>openSector(b.dataset.sector));}catch(e){unavailable(e)}}
function renderStockGroups(stocks){if(!stocks.length)return '<div class="empty">当前筛选下没有个股记录。</div>';const ordinary=stocks.filter(x=>x.source_family!=='V3_3_TODAY_CANDIDATE'),v33=stocks.filter(x=>x.source_family==='V3_3_TODAY_CANDIDATE');const heads=['来源','实体类型','股票名称','首次关注','六维状态与连续性','原支持板块 / 当前支持板块','候选场景','收益与回撤','数据质量','查看'];return `${ordinary.length?table(heads,ordinary.map(itemRow).join('')):''}${v33.length?`<details class="panel compact"><summary>V3.3 今日算法候选：${v33.length} 条（展开查看）</summary><p class="intro">每日算法候选收在独立分组中；观察池和历史记录保留规则与其他来源一致。</p>${table(heads,v33.map(itemRow).join(''))}</details>`:''}`}
function openSector(id){state.sectorId=id;state.sectorPage=1;$('#sector-title').textContent=state.sectorNames[id]||'观察板块';$('#sector-summary').textContent='板块入选时冻结的成分股；强弱只采用同日、同发布批次的已验收个股强度数据。';$('#sector-dialog').showModal();loadSectorPage()}
async function loadSectorPage(){const id=state.sectorId,body=$('#sector-body');body.innerHTML='<div class="empty">正在查询本页成分股…</div>';try{const x=await api(`/api/v3/focus-tracker/sectors/${encodeURIComponent(id)}/members`,{page:state.sectorPage,page_size:state.sectorPageSize});const ms=x.items||[];state.sectorTotal=x.total||0;$('#sector-page').textContent=`第 ${x.page} 页 · 共 ${x.total} 只`;$('#sector-prev').disabled=x.page<=1;$('#sector-next').disabled=!x.has_more;const rows=ms.map(m=>{const status=m.episode_id?`<b>${esc(tr('membership',m.source_membership_state))}</b><small class="member-path">${esc(tr('validity',m.validity_state))} · ${esc(tr('path',m.current_path_state))} · ${esc(tr('followup',m.followup_state))}</small>`:'<span class="member-unknown">尚未建立独立个股观察状态</span>';const strength=m.strength_status==='KNOWN'?`<span class="${m.strong_state?'member-strong':''}">${strengthLabel(m.strong_state)}</span>`:'<span class="member-unknown">强度数据未知</span>';return `<tr><td>${m.episode_id?`<button class="stock-name" data-member-episode="${esc(m.episode_id)}">${esc(m.security_name||'名称未提供')}</button>`:`<b>${esc(m.security_name||'名称未提供')}</b>`}<small class="stock-code">${esc(m.security_id)}</small></td><td>${strength}</td><td>${status}</td><td>${esc(pct(m.return_since_first))}<small class="member-path">最新已记录收盘：${m.close_price==null?'暂无':Number(m.close_price).toFixed(2)}</small></td><td>${esc(tr('quality',m.quality_status))}</td></tr>`}).join('');body.innerHTML=ms.length?table(['股票名称 / 代码','板块强弱','个股跟踪状态','观察以来表现','数据质量'],rows,'member-table'):'<div class="empty">这个板块的冻结成分篮子没有个股。</div>';body.querySelectorAll('[data-member-episode]').forEach(b=>b.onclick=()=>{const episode=b.dataset.memberEpisode;$('#sector-dialog').close();loadEpisode(episode)})}catch(e){body.innerHTML='<div class="empty">板块成分或强弱数据暂不可用，请稍后重试。</div>';$('#sector-page').textContent='本页查询失败'}}
async function loadEpisode(id){try{const x=await api('/api/v3/focus-tracker/episodes/'+encodeURIComponent(id));if(x.status!=='AVAILABLE')throw Error();const ep=x.episode;const transitions=(x.transitions||[]).map(t=>`<tr>${cell(t.transition_trade_date)}${cell(tr('event',t.transition_type))}${cell(tr('membership',t.from_membership))}${cell(tr('membership',t.to_membership))}<td class="event-reason">${esc((t.reason_codes||[]).map(r=>tr('reason',r)).join('；')||'未提供补充原因')}</td></tr>`).join('');const observations=(x.observations||[]).map(o=>`<tr>${cell(o.trade_date)}${cell(tr('membership',o.source_membership_state))}${cell(tr('phase',o.membership_phase))}${cell(tr('validity',o.validity_state))}${cell(tr('path',o.current_path_state))}${cell(tr('continuity',o.continuity_quality))}${cell(tr('quality',o.quality_status))}</tr>`).join('');const anchors=(x.anchors||[]).map(a=>`<tr>${cell(a.trade_date)}${cell(tr('event',a.anchor_type))}${cell(a.reference_price==null?'暂无':Number(a.reference_price).toFixed(2))}${cell(tr('quality',a.quality_status))}</tr>`).join('');const outcomes=(x.outcomes||[]).map(o=>`<tr>${cell(o.target_trade_date)}${cell(`${o.horizon} 个交易日`)}${cell(tr('generic',o.status))}${cell(pct(o.forward_return))}${cell(pct(o.mfe))}${cell(pct(o.mdd))}</tr>`).join('');const title=familyNames[ep.source_family]||'观察来源';const entityLabel=ep.entity_type==='STOCK'?'个股':'板块';const displayId=ep.entity_type==='SECTOR'?(state.sectorNames[ep.entity_id]||'观察板块'):`${ep.security_name||'名称未提供'}（${ep.entity_id}）`;$('#content').innerHTML=`<div class="detail"><button id="back" class="link">← 返回持续观察总览</button><h2>${esc(entityLabel)}观察记录 · ${esc(displayId)}</h2><div class="cards"><div class="card"><small>观察来源</small><b>${esc(title)}</b></div><div class="card"><small>首次进入观察</small><b>${esc(ep.first_trade_date)}</b></div><div class="card"><small>观察范围</small><b>${esc(x.trade_date)} 及以前</b></div></div><h3>在名单中的变化</h3>${transitions?table(['交易日','发生什么','原状态','新状态','原因说明'],transitions):'<div class="subtle">该观察段尚无名单变化记录。</div>'}<h3>每个交易日的状态</h3>${observations?table(['交易日','名单状态','本次变化','规则判断','走势路径','连续性','数据质量'],observations):'<div class="subtle">暂无逐日观察记录。</div>'}<h3>收益观察起点</h3>${anchors?table(['交易日','观察节点','参考价格','数据质量'],anchors):'<div class="subtle">暂无收益观察起点。</div>'}<h3>已到期的结果复盘</h3>${outcomes?table(['结果日期','观察期限','结果状态','区间收益','期间最大上涨','期间最大回撤'],outcomes):'<div class="subtle">当前没有已到期且可展示的结果；未到期结果不会提前估算。</div>'}</div>`;$('#back').onclick=loadItems;notice(`这是 ${x.trade_date} 当天已记录的观察时间线；不展示晚于所选日期的数据。`)}catch(e){unavailable(e)}}
async function loadTransitions(){try{const x=await api('/api/v3/focus-tracker/transitions',{page:state.page,page_size:state.pageSize});const rows=(x.items||[]).map(i=>`<tr>${cell(familyNames[i.source_family]||'其他来源')}${cell(i.entity_type==='STOCK'?'个股':'板块')}${cell(i.entity_type==='STOCK'?i.entity_id:(state.sectorNames[i.entity_id]||'观察板块'))}${cell(i.transition_trade_date)}${cell(tr('event',i.transition_type))}${cell(tr('membership',i.from_membership))}${cell(tr('membership',i.to_membership))}<td class="event-reason">${esc((i.reason_codes||[]).map(r=>tr('reason',r)).join('；')||'未提供补充原因')}</td></tr>`).join('');$('#content').innerHTML=`<p class="intro">这里按交易日列出观察名单的进入、持续、退出和重新进入记录。它用于回答“什么对象在什么时候发生了什么变化”，不代表实时行情信号。</p>${rows?table(['来源','实体类型','实体名称或代码','交易日','变化说明','变化前','变化后','原因'],rows):'<div class="empty">本次记录没有名单变化事件。</div>'}<div class="pager"><button id="prev" ${x.page<=1?'disabled':''}>上一页</button><span>第 ${x.page} 页 · 共 ${x.total} 条</span><button id="next" ${!x.has_more?'disabled':''}>下一页</button></div>`;$('#prev').onclick=()=>{state.page--;loadTransitions()};$('#next').onclick=()=>{state.page++;loadTransitions()};notice(`变化记录固定于 ${x.trade_date}。`)}catch(e){unavailable(e)}}
async function loadRuns(){try{const x=await api('/api/v3/focus-tracker/runs',{page:1,page_size:100});const rows=(x.items||[]).map(i=>`<tr>${cell(i.trade_date)}${cell(`第 ${i.revision} 次`)}${cell(tr('evaluation',i.evaluation_basis))}${cell(tr('lineage',i.lineage_state))}${cell(tr('quality',i.outcome_settlement_status))}<td><button class="link" data-run="${esc(i.focus_run_id)}">查看该日</button></td></tr>`).join('');$('#content').innerHTML=`<p class="intro">每行代表一个已接受的每日观察批次。选择“查看该日”后，观察池、变化和结果均固定到该批次，历史批次会明确标记。</p>${rows?table(['交易日','发布次数','数据模式','链路状态','结果结算','操作'],rows):'<div class="empty">没有可查看的已接受记录。</div>'}`;$('#content').querySelectorAll('[data-run]').forEach(b=>b.onclick=async()=>{try{state.run=await api('/api/v3/focus-tracker/summary',{focus_run_id:b.dataset.run});meta();state.page=1;state.tab='items';await selectTab('items')}catch(e){unavailable(e)}});notice(`已读取 ${x.total} 个可查看的每日批次。`)}catch(e){unavailable(e)}}
async function loadStatistics(){try{const x=await api('/api/v3/focus-tracker/statistics');const groups=x.groups||[];const rows=groups.map(g=>`<tr>${cell(familyNames[g.source_family]||'其他来源')}${cell(g.entity_type==='STOCK'?'个股':'板块')}${cell(tr('event',g.anchor_type))}${cell(`${g.horizon} 个交易日`)}${cell(tr('evaluation',g.evaluation_basis))}${cell(tr('quality',g.gate_status))}${cell(g.sample_count)}${cell(g.signal_date_count)}${cell(pct(g.p25_return))}${cell(pct(g.median_return))}${cell(pct(g.p75_return))}${cell(pct(g.max_mfe))}${cell(pct(g.worst_mdd))}${cell(g.incomplete_count)}</tr>`).join('');const missing=['NO_ACCEPTED_RUN','REPLAY_REQUIRED'].includes(x.status),waiting=['STATISTICS_NOT_MATERIALIZED','STATISTICS_SCHEMA_UNAVAILABLE'].includes(x.status),msg=x.message||(missing?'当前没有可复盘的有效观察记录。':'结果复盘数据尚未生成。');$('#content').innerHTML=`<p class="intro">这是历史观察结果的描述性统计，不预测后续涨跌。只有达到完整样本数和跨日覆盖门槛的分组才展示收益分位值。</p><div class="notice">展示门槛：至少 ${x.minimum_complete_rows??30} 条完整结果，并覆盖 ${x.minimum_signal_trade_dates??5} 个独立信号交易日。</div>${missing||waiting?`<div class="empty">${esc(msg)}</div>`:rows?table(['来源','实体','观察节点','期限','数据模式','样本门槛','完整样本','信号交易日','较低区间收益','中位区间收益','较高区间收益','期间最大上涨','期间最大回撤','未完整结果'],rows):'<div class="empty">目前没有达到展示门槛的结果组。</div>'}`;notice(msg,waiting||missing?'warn':'')}catch(e){unavailable(e)}}
async function selectTab(tab){state.tab=tab;state.page=1;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='items')await loadItems();else if(tab==='transitions')await loadTransitions();else await loadStatistics()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>selectTab(b.dataset.tab));
$('#sector-close').onclick=()=>$('#sector-dialog').close();$('#sector-dialog').addEventListener('click',e=>{if(e.target===$('#sector-dialog'))$('#sector-dialog').close()});$('#sector-prev').onclick=()=>{if(state.sectorPage>1){state.sectorPage--;loadSectorPage()}};$('#sector-next').onclick=()=>{if(state.sectorPage*state.sectorPageSize<state.sectorTotal){state.sectorPage++;loadSectorPage()}};
async function init(){try{state.run=await api('/api/v3/focus-tracker/summary');meta();if(['NO_ACCEPTED_RUN','REPLAY_REQUIRED'].includes(state.run.status)){notice(state.run.message||'当前没有可展示的有效观察记录。','warn');$('#content').innerHTML='<div class="empty">待有效观察批次启用后，这里会显示对应日期的记录。</div>';return}await selectTab('items')}catch(e){meta();unavailable(e);$('#content').innerHTML='<div class="empty">数据暂不可用，请稍后重试。</div>';const retry=document.createElement('button');retry.textContent='重试读取';retry.onclick=init;$('#content').append(retry)}}init();
})();
</script>
