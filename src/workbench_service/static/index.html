<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>统一研究工作台</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:"Microsoft YaHei",sans-serif;background:#f3f6fb}.top{min-height:64px;background:#142b4b;color:#fff;display:flex;align-items:center;gap:16px;padding:10px 22px;flex-wrap:wrap}.top strong{font-size:20px}.top select,.top button{padding:8px 12px;border-radius:8px;border:0}.top span{color:#dbe8f8}.job{margin-left:auto;display:none;min-width:330px;padding:7px 11px;border-radius:8px;background:#1e426e;color:#fff;font-size:13px}.job.show{display:block}.job b{display:block}.job small{color:#c9dbef}iframe{display:block;width:100%;height:calc(100% - 64px);border:0;background:#fff}.error{padding:30px;color:#b42318}
</style></head><body><div class="top"><strong>旧版研究工作台</strong><label>查看日期 <select id="date"></select></label><label>目标交易日 <input id="expected-date" type="date" value="2026-09-11"></label><button id="generate">构建目标日完整数据</button><button onclick="location.href='/'">返回当前工作台</button><button onclick="location.href='/operations'">运维中心</button><span id="state">正在读取已发布日期…</span><div id="job" class="job" aria-live="polite"><b id="jobTitle">后台发布任务</b><small id="jobDetail">等待任务状态…</small></div></div><iframe id="workbench" title="研究工作台"></iframe><script>
const csrf='__CSRF_TOKEN__',JOB_KEY='workbench-active-publication-job';
const date=document.getElementById('date'),frame=document.getElementById('workbench'),state=document.getElementById('state'),button=document.getElementById('generate'),job=document.getElementById('job'),jobTitle=document.getElementById('jobTitle'),jobDetail=document.getElementById('jobDetail');let timer;
const names={INPUT_QUEUED:'等待更新当日通达信数据',INPUT_DOWNLOADING:'正在下载并校验当日通达信数据',INPUT_FAILED:'当日输入更新失败',PUBLISHING:'输入校验通过，正在启动发布',QUEUED:'排队等待',COMPUTING:'正在计算当日数据',COMMITTING:'正在提交完整发布数据',COMMITTED:'发布完成',SUCCESS:'发布完成',FAILED:'发布失败',INTERRUPTED:'发布中断'};
function showJob(id,data){job.classList.add('show');const phase=data.progress?.status||data.status;jobTitle.textContent=`后台发布｜${names[phase]||phase}`;jobDetail.textContent=`任务 ${id} · 状态 ${data.status}${data.updated_at_utc?' · '+new Date(data.updated_at_utc).toLocaleTimeString():''}`;state.textContent=data.status==='SUCCESS'?'今日数据已发布':`当日数据发布中：${names[phase]||phase}`}
async function watch(id){clearInterval(timer);const tick=async()=>{try{const r=await fetch('/api/jobs?job_id='+encodeURIComponent(id)),x=await r.json();if(!r.ok)throw Error(x.message||x.code);showJob(id,x);if(['SUCCESS','FAILED','INTERRUPTED'].includes(x.status)){clearInterval(timer);button.disabled=false;localStorage.removeItem(JOB_KEY);if(x.status==='SUCCESS')setTimeout(()=>location.reload(),900)}}catch(e){job.classList.add('show');jobTitle.textContent='后台发布｜状态暂不可读';jobDetail.textContent=`任务 ${id}；将自动重试`;}};await tick();timer=setInterval(tick,2000)}
button.onclick=async()=>{button.disabled=true;state.textContent='正在提交后台任务…';try{const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({expected_trade_date:document.getElementById('expected-date').value,build_research_v3:true})}),x=await r.json();if(!r.ok)throw Error(x.message||x.code);localStorage.setItem(JOB_KEY,x.job_id);watch(x.job_id)}catch(e){state.textContent='提交失败：'+e.message;button.disabled=false}};
async function start(){try{const r=await fetch('/api/publications'),p=await r.json();const items=p.items||[];date.innerHTML=items.map(x=>`<option value="${x.publication_id}">${x.trade_date}</option>`).join('');const open=()=>{const selected=items.find(x=>x.publication_id===date.value);if(!selected){state.textContent='当前没有已发布数据；可直接构建目标交易日';frame.removeAttribute('src');return}state.textContent=`所选日期 ${selected.trade_date}｜完整静态工作台功能基线`;frame.src='/view?publication_id='+encodeURIComponent(date.value)};date.onchange=open;open();let active=localStorage.getItem(JOB_KEY);if(!active){const jobs=await fetch('/api/jobs?active=1').then(x=>x.json());active=jobs.items?.[0]?.job_id||null}if(active){button.disabled=true;watch(active)}}catch(e){state.textContent='读取失败：'+e.message;document.body.insertAdjacentHTML('beforeend','<div class="error">工作台加载失败，请检查本地服务。</div>')}}start();
</script></body></html>
