<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V3 在线涨停简图</title>
  <style>
    :root{--navy:#142b4b;--blue:#1769aa;--ink:#19324d;--muted:#60758b;--line:#dbe4ee;--bg:#f3f6fb;--card:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei",sans-serif}.top{background:var(--navy);color:#fff;padding:16px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.top h1{margin:0;font-size:20px}.top small{color:#dbe8f8}.top button,.filter button{border:0;border-radius:7px;padding:8px 12px;background:var(--blue);color:#fff;cursor:pointer}.wrap{max-width:1280px;margin:18px auto;padding:0 16px}.notice,.panel{background:var(--card);border:1px solid var(--line);border-radius:10px}.notice{padding:12px 14px;margin-bottom:14px;color:var(--muted)}.notice.warn{background:#fff8e9;border-color:#e8b25b;color:#7a4900}.filter{display:flex;align-items:end;gap:12px;flex-wrap:wrap;padding:14px;margin-bottom:14px}.filter label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px}.filter select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}.panel{padding:14px;overflow:auto}.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:10px}.table{width:100%;border-collapse:collapse;min-width:980px;font-size:13px}.table th,.table td{padding:10px 9px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top}.table th{background:#f8fafc;color:var(--muted);font-weight:600}.missing{color:#8a97a5}.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}.evidence{border:1px solid #c4d8e9;border-radius:6px;padding:5px 9px;background:#fff;color:var(--blue);cursor:pointer}.pager{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:13px;color:var(--muted)}.pager button{border:1px solid #c4d8e9;border-radius:6px;padding:6px 12px;background:#fff;color:var(--blue);cursor:pointer}.pager button:disabled{opacity:.45;cursor:not-allowed}.modal{position:fixed;inset:0;background:rgba(20,43,75,.42);display:grid;place-items:center;padding:16px;z-index:10}.modal[hidden]{display:none}.modal-card{width:min(960px,calc(100vw - 32px));max-height:85vh;overflow:auto;background:#fff;border-radius:10px;padding:18px;box-shadow:0 15px 50px rgba(0,0,0,.2)}.modal-head{display:flex;justify-content:space-between;gap:14px;align-items:center}.modal-head h2{margin:0;font-size:18px}.modal-close{border:0;background:transparent;color:var(--muted);font-size:24px;cursor:pointer}.evidence-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0;color:var(--muted);font-size:12px}.evidence-table{width:100%;border-collapse:collapse;font-size:12px}.evidence-table th,.evidence-table td{padding:8px;border-bottom:1px solid #edf1f5;text-align:left;vertical-align:top}.evidence-table th{color:var(--muted);background:#f8fafc}.evidence-note{padding:10px;background:#fff8e9;color:#7a4900;border-radius:6px}
  </style>
</head>
<body>
  <header class="top"><h1>V3 在线涨停简图</h1><small>EXT01 同花顺收盘事件批次 · 不混入本地梯队算法</small></header>
  <main class="wrap">
    <div id="notice" class="notice">正在读取已归档收盘批次…</div>
    <section class="filter"><label>排序<select id="sort"><option value="DEFAULT">默认：高度↓ / 末封↑ / 封单↓ / 代码↑</option><option value="FIRST_LIMIT_TIME">首封时间↑</option></select></label><button id="refresh" type="button">刷新</button></section>
    <section class="panel"><div id="meta" class="meta"></div><div id="table"></div><div class="pager"><button id="prev" type="button" disabled>上一页</button><span id="pageLabel">第 1 页</span><button id="next" type="button" disabled>下一页</button></div></section>
  </main>
  <div id="evidenceModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="evidenceTitle"><div class="modal-card"><div class="modal-head"><h2 id="evidenceTitle">事件证据</h2><button id="evidenceClose" class="modal-close" type="button" aria-label="关闭">×</button></div><div id="evidenceBody"></div></div></div>
  <script>
    const notice=document.getElementById('notice'),meta=document.getElementById('meta'),target=document.getElementById('table'),sort=document.getElementById('sort'),prev=document.getElementById('prev'),next=document.getElementById('next'),pageLabel=document.getElementById('pageLabel'),modal=document.getElementById('evidenceModal'),evidenceTitle=document.getElementById('evidenceTitle'),evidenceBody=document.getElementById('evidenceBody'),evidenceClose=document.getElementById('evidenceClose');
    const state={page:1,pageSize:20,hasMore:false,eventBundleId:null,tradeDate:null,lastEvidenceButton:null};
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const show=v=>(v===null||v===undefined||v==='')?'<span class="missing">未确认</span>':esc(v);
    function render(result){
      const warn=result.status!=='AVAILABLE'; notice.className='notice '+(warn?'warn':'');
      notice.textContent=(result.status||'UNKNOWN')+' · '+(result.empty_state?.message||result.next_action||''); state.eventBundleId=result.event_bundle_id||null;state.tradeDate=result.trade_date||null;
      meta.innerHTML=[['来源',result.source?.source_id],['交易日',result.trade_date],['观察时间',result.observed_at],['源截止',result.source_as_of],['覆盖',result.coverage?.coverage_status||'未确认'],['头统计涨停数',result.header?.counts?.source_limit_count],['唯一成员',result.total]].map(x=>'<span><b>'+esc(x[0])+'：</b>'+show(x[1])+'</span>').join('');
      if(!result.items?.length){target.innerHTML='<div class="empty">'+esc(result.empty_state?.message||'当前没有可展示的收盘涨停成员。')+'</div>'} else {target.innerHTML='<table class="table"><thead><tr><th>代码</th><th>名称</th><th>高度</th><th>状态</th><th>价格</th><th>涨幅</th><th>成交额</th><th>封单额</th><th>首封</th><th>末封</th><th>开板</th><th>来源原因</th><th>证据</th></tr></thead><tbody>'+result.items.map(r=>'<tr><td>'+show(r.security_id||r.source_code)+'</td><td>'+show(r.security_name||r.source_fields?.name)+'</td><td>'+show(r.height_display)+'</td><td>'+show(r.event_state)+'</td><td>'+show(r.price)+'</td><td>'+show(r.ret1)+'</td><td>'+show(r.amount)+'</td><td>'+show(r.seal_amount)+'</td><td>'+show(r.first_limit_time)+'</td><td>'+show(r.last_limit_time)+'</td><td>'+show(r.open_count)+'</td><td>'+show(r.source_reason)+'</td><td><button class="evidence" data-security-id="'+esc(r.security_id||r.source_code)+'" type="button">查看</button></td></tr>').join('')+'</tbody></table>';target.querySelectorAll('.evidence').forEach(button=>button.addEventListener('click',()=>openEvidence(button)))}
      state.hasMore=!!result.has_more;prev.disabled=state.page<=1;next.disabled=!state.hasMore;pageLabel.textContent='第 '+state.page+' 页 · 返回 '+(result.returned_count||0)+' / '+(result.total||0);
    }
    function renderEvidence(result){const item=result.item||{};const fields=result.evidence?.field_evidence||[];evidenceTitle.textContent='事件证据 · '+(result.security_id||'未确认');if(result.status==='UNAVAILABLE'){evidenceBody.innerHTML='<div class="empty">'+esc(result.empty_state?.message||'当前没有该股票的在线事件证据。')+'</div>';return}evidenceBody.innerHTML='<div class="evidence-grid">'+[['来源',result.source?.source_id],['数据集',result.source?.dataset],['交易日',result.trade_date],['观察时间',result.observed_at],['源截止',result.source_as_of],['事件批次',result.batch_id],['覆盖',result.evidence?.coverage?.coverage_status||'未确认']].map(x=>'<span><b>'+esc(x[0])+'：</b>'+show(x[1])+'</span>').join('')+'</div><div class="evidence-note">'+esc(result.source_time?.warning||'来源时间已按批次证据展示；观察时间不等同于逐股成交时间。')+'</div><h3>字段证据</h3><table class="evidence-table"><thead><tr><th>规范字段</th><th>来源字段</th><th>值</th><th>状态</th></tr></thead><tbody>'+fields.map(f=>'<tr><td>'+esc(f.normalized_field)+'</td><td>'+esc(f.source_field)+'</td><td>'+show(f.value)+'</td><td>'+esc(f.status)+'</td></tr>').join('')+'</tbody></table><h3>事件摘要</h3><div class="evidence-grid">'+[['代码',item.security_id||item.source_code],['高度',item.height_display],['首封',item.first_limit_time],['末封',item.last_limit_time],['开板次数',item.open_count],['来源原因',item.source_reason]].map(x=>'<span><b>'+esc(x[0])+'：</b>'+show(x[1])+'</span>').join('')+'</div>'}
    async function openEvidence(button){state.lastEvidenceButton=button;const id=button.dataset.securityId;const q=new URLSearchParams();if(state.eventBundleId)q.set('event_bundle_id',state.eventBundleId);if(state.tradeDate)q.set('trade_date',state.tradeDate);evidenceBody.innerHTML='<div class="empty">正在读取来源证据…</div>';modal.hidden=false;evidenceClose.focus();try{const response=await fetch('/api/v3/events/ladder/'+encodeURIComponent(id)+'?'+q.toString(),{cache:'no-store'});const result=await response.json();if(!response.ok)throw Error(result.message||result.code||response.status);renderEvidence(result)}catch(e){evidenceBody.innerHTML='<div class="empty">在线证据读取失败：'+esc(e.message)+'</div>'}}
    function closeEvidence(){modal.hidden=true;if(state.lastEvidenceButton?.isConnected)state.lastEvidenceButton.focus()}
    async function load(){try{const q=new URLSearchParams({page:state.page,page_size:state.pageSize,sort:sort.value});const response=await fetch('/api/v3/events/ladder?'+q.toString(),{cache:'no-store'});const result=await response.json();if(!response.ok)throw Error(result.message||result.code||response.status);render(result)}catch(e){notice.className='notice warn';notice.textContent='在线涨停简图读取失败：'+e.message;meta.replaceChildren();target.innerHTML='<div class="empty">当前无法读取在线事件批次，不以本地数据冒充在线事实。</div>';prev.disabled=true;next.disabled=true}}
    sort.addEventListener('change',()=>{state.page=1;load()});document.getElementById('refresh').addEventListener('click',()=>{state.page=1;load()});prev.addEventListener('click',()=>{if(state.page>1){state.page--;load()}});next.addEventListener('click',()=>{if(state.hasMore){state.page++;load()}});evidenceClose.addEventListener('click',closeEvidence);modal.addEventListener('click',event=>{if(event.target===modal)closeEvidence()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!modal.hidden)closeEvidence()});load();
  </script>
</body>
</html>
