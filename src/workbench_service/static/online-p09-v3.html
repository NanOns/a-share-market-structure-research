<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>V3 在线事件与热度</title>
  <style>
    :root{--ink:#19324d;--muted:#60758b;--line:#dbe4ee;--bg:#f3f6fb;--card:#fff;--blue:#1769aa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei",sans-serif}.top{background:#142b4b;color:#fff;padding:18px 22px}.top h1{margin:0 0 5px;font-size:21px}.top small{color:#dbe8f8}.wrap{max-width:1280px;margin:18px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px;min-height:180px}.card h2{font-size:16px;margin:0 0 8px}.status{font-weight:600;margin:7px 0;color:var(--blue)}.status.warn{color:#9a6000}.meta{color:var(--muted);font-size:12px;line-height:1.8}.links{margin:15px 0;padding:12px;background:#fff;border:1px solid var(--line);border-radius:10px}.links a{margin-right:14px;color:var(--blue)}button{border:0;border-radius:6px;padding:7px 11px;background:var(--blue);color:#fff;cursor:pointer}.list{margin-top:10px;max-height:160px;overflow:auto}.row{padding:6px 0;border-bottom:1px solid #edf1f5}.empty{color:var(--muted);padding:20px 0}
  </style>
</head>
<body>
  <header class="top"><h1>V3 在线事件与热度</h1><small>EXT01–EXT09 独立来源状态 · 请求时读取 · 不写入 raw/row/batch</small></header>
  <main class="wrap">
    <nav class="links"><a href="/v3/online">在线总览</a><a href="/v3/events">涨停简图与单股证据</a><a href="/v3">本地双轨研究</a><button id="refresh" type="button">刷新在线卡片</button></nav>
    <section class="grid">
      <article class="card"><h2>速览统计</h2><div id="overview" class="empty">正在读取…</div></article>
      <article class="card"><h2>七池详情</h2><select id="poolType"><option value="super_stock">强势股</option><option value="limit_up">涨停</option><option value="limit_up_broken">炸板</option><option value="yesterday_limit_up">昨日涨停</option><option value="limit_down">跌停</option><option value="new_stock">新股</option><option value="nearly_new">次新股</option></select><button data-load="pools">读取明细</button><div id="pools" class="empty">按需读取。</div></article>
      <article class="card"><h2>最强题材 / 涨停分布</h2><div id="topics" class="empty">正在读取…</div><div id="topicMembers"></div><button id="distributionLoad">查看分布</button><div id="distribution"></div></article>
      <article class="card"><h2>个股热榜四榜</h2><select id="rankMode"><option value="hour_normal">小时热榜</option><option value="hour_skyrocket">小时飙升</option><option value="day_normal">日热榜</option><option value="day_skyrocket">日飙升</option></select><button id="rankLoad">读取榜单</button><div id="ranks" class="empty">按需读取。</div></article>
      <article class="card"><h2>热门概念 / 行业</h2><div id="plates" class="empty">正在读取…</div></article>
      <article class="card"><h2>热门话题</h2><div id="hotTopics" class="empty">正在读取…</div></article>
    </section>
    <p class="meta">说明：在线事实与本地收盘研究分开；来源失败只影响对应卡片。EXT11 已按 V3 §22 退出现行目标链，不用未验证报价地址替代。</p>
  </main>
  <script>
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const show=(id,text,ok)=>{const el=document.getElementById(id);el.innerHTML='<div class="status '+(ok?'':'warn')+'">'+esc(text)+'</div>'};
    const rows=(items,render)=>'<div class="list">'+(items||[]).map(render).join('')+'</div>';
    const time=j=>'<div class="meta">观察 '+esc(j.source_time?.received_at||'未知')+' · 来源截止 '+esc(j.source_time?.source_as_of||'未知')+' · 覆盖 '+esc(j.coverage?.coverage_status||'未知')+'</div>';
    async function get(path){const r=await fetch(path,{cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.message||j.code||r.status);return j}
    async function loadOverview(){try{const j=await get('/api/v3/events/overview');show('overview',j.status+' · EXT01 '+(j.source_status?.EXT01||'UNKNOWN')+' · EXT02 '+(j.source_status?.EXT02||'UNKNOWN')+' · EXT06 '+(j.source_status?.EXT06||'UNKNOWN'),j.status==='AVAILABLE');const m=j.market_overview?.data||{};const rf=m.rise_fall||{};const p=j.promotion||{};const rate=p.rate==null?'不可用':(p.rate*100).toFixed(1)+'%';document.getElementById('overview').insertAdjacentHTML('beforeend','<div class="meta">同花顺概况：涨 '+esc(rf.rise??'未知')+' / 跌 '+esc(rf.fall??'未知')+' / 平 '+esc(rf.deuce??'未知')+'；成交 '+esc(m.turnover_display?.now??'未知')+'（来源显示值）。涨停当前页 '+esc(j.event_close?.returned_count)+'，跌停当前页 '+esc(j.limit_down?.returned_count)+'。昨日涨停表现池晋级 '+esc(rate)+'（成功 '+esc(p.success_count??'未知')+' / 可判定 '+esc(p.eligible_count??'未知')+'，未知 '+esc(p.unknown_count??'未知')+'）。</div>')}catch(e){show('overview','UNAVAILABLE · '+e.message,false)}}
    async function loadTopics(){try{const j=await get('/api/v3/events/topics');show('topics',j.status+' · 题材 '+j.topic_count+' · 唯一涨停成员 '+j.unique_limit_up_member_count,j.status==='AVAILABLE');document.getElementById('topics').insertAdjacentHTML('beforeend',rows(j.items,x=>'<div class="row">'+esc(x.topic_name)+' · 涨停 '+esc(x.limit_up_member_count)+' · 唯一成员 '+esc(x.unique_member_count)+' <button class="memberLoad" data-id="'+esc(x.source_topic_id)+'">成员</button></div>')+'<div class="meta">EXT03/04 来源截止：'+esc(j.source_time?.EXT03?.source_as_of||'未知')+' / '+esc(j.source_time?.EXT04?.source_as_of||'未知')+'</div>');document.querySelectorAll('.memberLoad').forEach(b=>b.addEventListener('click',()=>loadMembers(b.dataset.id,1)))}catch(e){show('topics','UNAVAILABLE · '+e.message,false)}}
    async function loadMembers(id,page){try{const j=await get('/api/v3/events/topics/'+encodeURIComponent(id)+'/members?page='+page+'&page_size=30');document.getElementById('topicMembers').innerHTML='<h3>题材成员 '+esc(id)+' · '+esc(j.total)+' 条</h3>'+rows(j.items,x=>'<div class="row">'+esc(x.security_name||x.source_code)+' · 涨停 '+esc(x.is_limit_up)+'</div>')+(page>1?'<button id="prevMembers">上一页</button>':'')+(j.has_more?'<button id="nextMembers">下一页</button>':'');document.getElementById('prevMembers')?.addEventListener('click',()=>loadMembers(id,page-1));document.getElementById('nextMembers')?.addEventListener('click',()=>loadMembers(id,page+1))}catch(e){show('topicMembers','UNAVAILABLE · '+e.message,false)}}
    async function loadDistribution(){try{const j=await get('/api/v3/events/distribution');show('distribution',j.status+' · '+(j.items||[]).length+' 个题材',j.status==='AVAILABLE');document.getElementById('distribution').insertAdjacentHTML('beforeend','<div class="meta">全局唯一成员 '+esc(j.global_unique_member_count??'未知')+' · 题材归属次数 '+esc(j.membership_count??'未知')+' · 在线成交额 '+esc(j.amount_coverage||'未知')+' · 龙字诀算法估算 '+esc(j.dragon_estimated_amount_yi??'不可用')+' 亿元（有效成员 '+esc(j.dragon_estimated_valid_count??0)+'）</div>'+rows(j.items,x=>'<div class="row">'+esc(x.topic_name)+' · 涨停唯一成员 '+esc(x.limit_up_member_count)+' · 估算额 '+esc(x.dragon_estimated_amount_yi??'不可用')+' 亿元（'+esc(x.dragon_estimated_valid_count??0)+' 成员） · 前五 '+(x.preview_members||[]).map(m=>esc(m.security_name||m.source_code)).join('、')+'</div>'))}catch(e){show('distribution','UNAVAILABLE · '+e.message,false)}}
    async function loadRanks(){try{const [type,list_type]=document.getElementById('rankMode').value.split('_');const j=await get('/api/v3/hot-rankings?type='+type+'&list_type='+list_type);const v=j.lists[type+'_'+list_type];show('ranks',v.status+' · '+v.returned_count+' 条',v.status==='AVAILABLE');document.getElementById('ranks').insertAdjacentHTML('beforeend',time(v)+rows(v.items,x=>'<div class="row">'+esc(x.platform_rank)+' · '+esc(x.security_name||x.source_code)+' · 升降 '+esc(x.rank_change||'未知')+'</div>'))}catch(e){show('ranks','UNAVAILABLE · '+e.message,false)}}
    async function loadPlates(){const parts=[];for(const type of ['concept','industry']){try{const v=await get('/api/v3/hot-plates?type='+type);parts.push('<div class="status">'+esc(type)+' '+esc(v.status)+'</div>'+time(v)+rows(v.items,x=>'<div class="row">'+esc(x.platform_rank??'—')+' · '+esc(x.plate_name)+' · 来源 rate '+esc(x.source_rate??'未知')+'</div>'))}catch(e){parts.push('<div class="status warn">'+esc(type)+' UNAVAILABLE · '+esc(e.message)+'</div>')}}document.getElementById('plates').innerHTML=parts.join('')}
    async function loadHotTopics(page=1){try{const j=await get('/api/v3/hot-topics?page='+page+'&page_size=30');show('hotTopics',j.status+' · 第 '+page+' 页 '+j.returned_count+' 条 · 请求时读取',j.status==='AVAILABLE');document.getElementById('hotTopics').insertAdjacentHTML('beforeend',time(j)+rows(j.items,x=>'<div class="row">'+esc(x.topic_title)+' · '+esc(x.topic_subtitle||'')+' · 热度 '+esc(x.hot_value??'未知')+(x.safe_external_url?' <a href="'+esc(x.safe_external_url)+'" target="_blank" rel="noopener noreferrer">来源</a>':'')+'</div>')+(page>1?'<button id="prevHotTopics">上一页</button>':'')+(j.has_more?'<button id="nextHotTopics">下一页（可能有更多）</button>':''));document.getElementById('prevHotTopics')?.addEventListener('click',()=>loadHotTopics(page-1));document.getElementById('nextHotTopics')?.addEventListener('click',()=>loadHotTopics(page+1))}catch(e){show('hotTopics','UNAVAILABLE · '+e.message,false)}}
    async function loadPools(page=1){try{const pool=document.getElementById('poolType').value;const j=await get('/api/v3/events/pools?pool_type='+encodeURIComponent(pool)+'&page='+page+'&page_size=30');const v=j.pools[pool];show('pools',v.status+' · 当前页 '+v.returned_count+' 条 · 来源返回 '+v.total+' 条',v.status==='AVAILABLE');document.getElementById('pools').insertAdjacentHTML('beforeend',time(v)+rows(v.items,x=>'<div class="row">'+esc(x.security_name||x.source_code)+' · '+esc(x.price??'价格未知')+' · '+esc(x.source_reason||'原因未知')+'</div>')+(page>1?'<button id="prevPool">上一页</button>':'')+(v.has_more?'<button id="nextPool">下一页</button>':''));document.getElementById('prevPool')?.addEventListener('click',()=>loadPools(page-1));document.getElementById('nextPool')?.addEventListener('click',()=>loadPools(page+1))}catch(e){show('pools','UNAVAILABLE · '+e.message,false)}}
    function load(){loadOverview();loadTopics();loadPlates();loadHotTopics(1)}document.getElementById('refresh').addEventListener('click',load);document.querySelector('[data-load="pools"]').addEventListener('click',()=>loadPools(1));document.getElementById('rankLoad').addEventListener('click',loadRanks);document.getElementById('distributionLoad').addEventListener('click',loadDistribution);load();
  </script>
</body>
</html>
