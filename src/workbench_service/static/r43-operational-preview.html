<!doctype html><html lang="zh"><meta charset="utf-8"><title>R4.3 运营研究</title>
<style>body{font:16px system-ui;background:#0c1524;color:#deebff;max-width:1200px;margin:30px auto;padding:20px}h1{font-size:24px}button,select{padding:9px;background:#213754;color:#fff;border:1px solid #476589;border-radius:6px}pre{white-space:pre-wrap;background:#142239;padding:18px;max-height:520px;overflow:auto}.label{padding:16px;background:#3b3215;border-left:4px solid #dab553}a{color:#8dcaff}</style>
<h1 id="title">运营研究预览</h1><p class="label">成员关系采用所绑定来源快照；历史回算不代表历史当日成员。RECONSTRUCTED · AS_RECORDED=false · strict PIT 未获准。<span id="scope"></span></p>
<p><select id="day"></select> <select id="domain"><option value="stocks">个股 Profile</option><option value="core">Core</option><option value="sectors">TDX 行业/概念</option><option value="relative_sector">个股相对板块 LOO</option><option value="rotation">Rotation</option><option value="raw">真实 RAW</option><option value="focus">Focus</option><option value="forward">Forward</option><option value="market">Market</option><option value="events">Events</option><option value="diagnostics">诊断</option></select> <button onclick="load()">读取同版数据</button> <a href="/api/v4/original/context" target="_blank">独立历史读域</a></p><pre id="context"></pre><pre id="data"></pre>
<script>let ctx;async function load(){if(!ctx){ctx=await(await fetch('/api/v4/context')).json();document.querySelector('#context').textContent=JSON.stringify(ctx,null,2);document.querySelector('#scope').textContent=ctx.production_accepted?'已独立接受的运营研究版本。':'候选预览；生产尚未切换。';let options=[...(ctx.published_sessions||[])];if(ctx.trade_date&&!options.includes(ctx.trade_date))options.push(ctx.trade_date);options.sort();for(const value of options){const option=document.createElement('option');option.value=value;option.textContent=value;day.append(option)}if(ctx.trade_date)day.value=ctx.trade_date}if(!day.value)return;let x=await(await fetch('/api/v4/'+domain.value+'?trade_date='+encodeURIComponent(day.value)+'&context_token='+encodeURIComponent(ctx.context_token)+'&limit=3')).json();let n=Array.isArray(x.rows)?x.rows.length:null;x.rows=Array.isArray(x.rows)?x.rows.slice(0,3):x.rows;document.querySelector('#data').textContent=JSON.stringify({...x,total_row_count:x.total??n},null,2)}load()</script></html>
