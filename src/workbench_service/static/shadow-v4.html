<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4 Shadow · 研究观察</title>
<style>
:root{color-scheme:dark;--bg:#0b1320;--card:#152235;--line:#304258;--muted:#afbed0;--accent:#79dfca}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf4fc;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1440px;margin:auto;padding:28px}nav{display:flex;gap:20px}a{color:var(--accent)}h1{font-size:28px;margin:12px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px}.subtitle,.muted{color:var(--muted)}.badge{display:inline-block;padding:3px 12px;border:1px solid var(--accent);border-radius:20px;color:var(--accent);margin-right:8px}.banner{padding:22px;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--card);margin:24px 0}.simulation{border-color:#f3c478;color:#ffe1a0}.blocked{border-color:#ef9999;color:#ffb7b7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}section{background:var(--card);border:1px solid var(--line);padding:20px;border-radius:12px;min-width:0}.identity{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}dl{margin:0}dt{font-size:12px;color:var(--muted)}dd{margin:3px 0;overflow-wrap:anywhere;white-space:pre-wrap}.field{padding:9px 0;border-bottom:1px solid var(--line)}.quality{color:#f3c478;font-size:12px;margin-left:8px}button,input{font:inherit;background:#102034;color:#edf4fc;border:1px solid #526982;border-radius:5px;padding:7px 12px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.record{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:8px}.scope{font-size:12px;overflow-wrap:anywhere}footer{margin-top:28px;color:var(--muted)}details{font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}@media(max-width:800px){main{padding:16px}.grid,.identity{grid-template-columns:1fr}}
</style></head><body><main>
<nav><a href="/v3">V3 研究</a><a href="/v3/focus-tracker">Focus 跟踪</a><span class="muted">只读导航</span></nav>
<h1>V4 Shadow <span class="badge">SHADOW · 只读</span></h1><p class="subtitle">从已接受研究状态到 Forward 结算的完整观察链</p>
<div id="status" class="banner" role="status">正在校验上下文…</div>
<section aria-label="上下文"><h2>上下文 / 来源身份</h2><div id="identity" class="identity"></div><p id="token" class="scope"></p><button id="refresh">刷新同一上下文</button></section>
<div id="components" class="grid" style="margin-top:18px"></div>
<footer>R26 工程预览 · 真实 Shadow 读取、V4-17 最终验收及 V4-17G 均未授权。R25 等待已接受当日输入。</footer>
</main><script src="/v4/shadow.js"></script></body></html>
