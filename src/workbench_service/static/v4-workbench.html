<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V4 工作台 · 已接受研究</title>
<style>
:root{--bg:#0b1320;--card:#152235;--line:#304258;--muted:#b4c3d4;--accent:#79dfca;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf4fc;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1440px;margin:auto;padding:28px}nav{display:flex;gap:22px;flex-wrap:wrap}a{color:var(--accent)}h1{font-size:30px;margin:18px 0 6px}h2{font-size:21px;margin:0}p{margin:8px 0}.muted{color:var(--muted)}.badge{font-size:12px;padding:4px 9px;display:inline-block;border:1px solid #526982;border-radius:6px;overflow-wrap:anywhere}.mode{color:var(--accent)}.banner,section{padding:22px;border:1px solid var(--line);background:var(--card);border-radius:12px;margin:20px 0}.banner{border-left:4px solid var(--accent)}.identity{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.identity strong{display:block}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}input,select,button{font:inherit;background:#102034;color:#edf4fc;border:1px solid #526982;border-radius:6px;padding:8px 12px}button{cursor:pointer}button:disabled{opacity:.4}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.record{padding:14px;border:1px solid var(--line);border-radius:8px;min-width:0}.record>strong{display:block;color:var(--accent);overflow-wrap:anywhere;font-size:13px}.field{margin:7px 0;overflow-wrap:anywhere}.label{color:var(--muted);font-size:12px}.value{display:block}.quality{font-size:11px;color:#f3c478}details{font-size:12px;color:var(--muted);margin-top:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.note{padding:10px 0;color:#e8d4a1}.error{color:#ffb7b7}footer{margin:24px 0;color:var(--muted)}@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.identity{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){main{padding:16px}.cards,.identity{grid-template-columns:1fr}}
</style></head><body><main>
<nav><a href="/v4">当前已接受研究</a><a href="/v4/shadow">Shadow 运行诊断</a><a href="/v3">V3 历史诊断</a><a href="#health">来源健康</a></nav>
<h1>V4 工作台</h1><p class="muted">已接受数据 · 只读研究观察</p>
<div id="status" class="banner" role="status">正在核验当前已接受来源…</div>
<div class="tools"><button id="refresh">刷新当前已接受状态</button><span id="token" class="muted"></span></div>
<section id="summary"><h2>最近一次变化 / Why Now</h2><p class="muted">这些是最近一次已接受状态，不是今天新生成的数据。</p><div class="content"></div></section>
<section id="radar"><h2>研究雷达</h2><div class="tools"><input aria-label="雷达搜索" data-query="radar" placeholder="股票代码 / 名称 / 对象"><select aria-label="雷达筛选" data-state="radar"><option value="">全部状态</option><option value="CONFIRMED">CONFIRMED</option><option value="PREWATCH">PREWATCH</option></select></div><div class="content"></div></section>
<section id="entity"><h2>股票状态与行情</h2><div class="tools"><input aria-label="股票搜索" data-query="entity" placeholder="股票代码 / 名称"><select aria-label="股票状态筛选" data-state="entity"><option value="">全部状态</option><option value="CONFIRMED">CONFIRMED</option><option value="PREWATCH">PREWATCH</option></select></div><div class="content"></div></section>
<section id="sector"><h2>板块状态与成员关系</h2><div class="tools"><input aria-label="板块搜索" data-query="sector" placeholder="板块名称 / 编码"></div><div class="content"></div></section>
<section id="cohort"><h2>Cohort / Forward</h2><p class="muted">当前已接受来源样本，成熟度按期限单独核验。</p><div class="content"></div></section>
<section id="settlement"><h2>结算与修订</h2><div class="content"></div></section>
<section id="health"><h2>运行健康 / 来源质量</h2><div class="content"></div></section>
<footer>产品版本 V4 · 页面展示不授予 Focus 写入、交易执行或模型有效性。每个模块保留原始来源质量与能力边界。</footer>
</main><script src="/v4/workbench.js"></script></body></html>
